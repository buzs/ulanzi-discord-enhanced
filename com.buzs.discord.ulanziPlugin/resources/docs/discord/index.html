<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discord Enhanced setup</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="eyebrow" data-text="eyebrow"></div>
      <h1 data-text="title"></h1>
      <p class="lead" data-text="lead"></p>
      <label class="language-picker">
        <span data-text="language"></span>
        <select id="language"></select>
      </label>
    </header>

    <section class="notice notice-warning">
      <h2 data-text="accessTitle"></h2>
      <p data-text="accessBody"></p>
    </section>

    <section class="card">
      <h2 data-text="redirectTitle"></h2>
      <p data-text="redirectIntro"></p>
      <div class="copy-row">
        <code id="redirect-uri"></code>
        <button id="copy" type="button" data-text="copy"></button>
      </div>
      <p class="hint" data-text="redirectFallback"></p>
    </section>

    <section class="card">
      <h2 data-text="stepsTitle"></h2>
      <ol id="steps"></ol>
      <a class="button button-primary" href="https://discord.com/developers/applications" target="_blank" rel="noreferrer" data-text="developerPortal"></a>
    </section>

    <section class="card split">
      <div>
        <h2 data-text="connectTitle"></h2>
        <ol id="connect-steps"></ol>
      </div>
      <div>
        <h2 data-text="privacyTitle"></h2>
        <p data-text="privacyBody"></p>
        <h2 data-text="requirementsTitle"></h2>
        <p data-text="requirementsBody"></p>
      </div>
    </section>

    <section class="card">
      <h2 data-text="troubleTitle"></h2>
      <ul id="troubleshooting"></ul>
      <a class="text-link" href="https://www.ulanzistudio.com/doc/discord_en" target="_blank" rel="noreferrer" data-text="officialGuide"></a>
    </section>

    <footer data-text="footer"></footer>
  </main>
  <script src="./guide.js"></script>
</body>
</html>
